<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食事編集</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fb; color: #253047; }
        .edit-card { border: 0; border-radius: 20px; box-shadow: 0 8px 24px rgba(30,45,75,.07); }
        .form-control { border-radius: 10px; padding: 12px; }
        .form-label { font-weight: 600; }
    </style>
</head>
<body>
<main class="container py-4 py-md-5" style="max-width: 720px;">
    <h1 class="h3 fw-bold mb-4">食事編集</h1>

    <div class="card edit-card">
        <div class="card-body p-3 p-md-4">
            <form th:action="@{/update/{id}(id=${meal.id})}"
                  method="post" th:object="${meal}">

                <div class="mb-3">
                    <label class="form-label">日付</label>
                    <input type="date" class="form-control" th:field="*{mealDate}">
                    <div class="text-danger"
                         th:if="${#fields.hasErrors('mealDate')}"
                         th:errors="*{mealDate}"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label">食事名</label>
                    <input type="text" class="form-control" th:field="*{mealName}">
                    <div class="text-danger"
                         th:if="${#fields.hasErrors('mealName')}"
                         th:errors="*{mealName}"></div>
                </div>

                <div class="row row-cols-2 g-3 mb-4">
                    <div class="col">
                        <label class="form-label">カロリー (kcal)</label>
                        <input type="number" class="form-control" th:field="*{calories}">
                        <div class="text-danger"
                             th:if="${#fields.hasErrors('calories')}"
                             th:errors="*{calories}"></div>
                    </div>
                    <div class="col">
                        <label class="form-label">たんぱく質 (g)</label>
                        <input type="number" step="0.1" class="form-control" th:field="*{protein}">
                        <div class="text-danger"
                             th:if="${#fields.hasErrors('protein')}"
                             th:errors="*{protein}"></div>
                    </div>
                    <div class="col">
                        <label class="form-label">脂質 (g)</label>
                        <input type="number" step="0.1" class="form-control" th:field="*{fat}">
                        <div class="text-danger"
                             th:if="${#fields.hasErrors('fat')}"
                             th:errors="*{fat}"></div>
                    </div>
                    <div class="col">
                        <label class="form-label">炭水化物 (g)</label>
                        <input type="number" step="0.1" class="form-control" th:field="*{carbs}">
                        <div class="text-danger"
                             th:if="${#fields.hasErrors('carbs')}"
                             th:errors="*{carbs}"></div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-fill">更新する</button>
                    <a th:href="@{/(date=${meal.mealDate})}"
                       class="btn btn-secondary flex-fill">戻る</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
