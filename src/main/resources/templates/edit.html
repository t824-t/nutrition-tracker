<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>食事編集</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1 class="mb-4">
        食事編集
    </h1>

    <form
            th:action="@{/update/{id}(id=${meal.id})}"
            method="post"
            th:object="${meal}">


        <!-- 日付 -->
        <div class="mb-3">

            <label class="form-label">
                日付
            </label>

            <input
                    type="date"
                    class="form-control"
                    th:field="*{mealDate}">

            <div
                    class="text-danger"
                    th:if="${#fields.hasErrors('mealDate')}"
                    th:errors="*{mealDate}">
            </div>

        </div>


        <!-- 食事名 -->
        <div class="mb-3">

            <label class="form-label">
                食事名
            </label>

            <input
                    type="text"
                    class="form-control"
                    th:field="*{mealName}">

            <div
                    class="text-danger"
                    th:if="${#fields.hasErrors('mealName')}"
                    th:errors="*{mealName}">
            </div>

        </div>


        <!-- カロリー -->
        <div class="mb-3">

            <label class="form-label">
                カロリー
            </label>

            <input
                    type="number"
                    class="form-control"
                    th:field="*{calories}">

            <div
                    class="text-danger"
                    th:if="${#fields.hasErrors('calories')}"
                    th:errors="*{calories}">
            </div>

        </div>


        <!-- たんぱく質 -->
        <div class="mb-3">

            <label class="form-label">
                たんぱく質
            </label>

            <input
                    type="number"
                    step="0.1"
                    class="form-control"
                    th:field="*{protein}">

            <div
                    class="text-danger"
                    th:if="${#fields.hasErrors('protein')}"
                    th:errors="*{protein}">
            </div>

        </div>


        <!-- 脂質 -->
        <div class="mb-3">

            <label class="form-label">
                脂質
            </label>

            <input
                    type="number"
                    step="0.1"
                    class="form-control"
                    th:field="*{fat}">

            <div
                    class="text-danger"
                    th:if="${#fields.hasErrors('fat')}"
                    th:errors="*{fat}">
            </div>

        </div>


        <!-- 炭水化物 -->
        <div class="mb-3">

            <label class="form-label">
                炭水化物
            </label>

            <input
                    type="number"
                    step="0.1"
                    class="form-control"
                    th:field="*{carbs}">

            <div
                    class="text-danger"
                    th:if="${#fields.hasErrors('carbs')}"
                    th:errors="*{carbs}">
            </div>

        </div>


        <!-- 更新 -->
        <button
                type="submit"
                class="btn btn-primary me-2">
            更新
        </button>


        <!-- 一覧へ戻る -->
        <a
                th:href="@{/(date=${meal.mealDate})}"
                class="btn btn-secondary">
            戻る
        </a>

    </form>

</div>

</body>
</html>
