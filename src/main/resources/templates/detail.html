<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食事詳細</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fb; color: #253047; }
        .detail-card { border: 0; border-radius: 20px; box-shadow: 0 8px 24px rgba(30,45,75,.07); }
        .nutrient { background: #f5f7fb; border-radius: 12px; padding: 12px 4px; text-align: center; }
        .nutrient .value { font-weight: 700; font-size: 1.15rem; }
        .nutrient small { color: #697386; }
    </style>
</head>
<body>
<main class="container py-4 py-md-5" style="max-width: 720px;">
    <h1 class="h3 fw-bold mb-4">食事詳細</h1>

    <div class="card detail-card">
        <div class="card-body p-3 p-md-4">
            <div class="d-flex justify-content-between align-items-start gap-2 mb-4">
                <h2 class="h4 fw-bold mb-0" th:text="${meal.mealName}">食事名</h2>
                <span class="text-secondary text-nowrap"
                      th:text="${meal.mealDate != null ? #temporals.format(meal.mealDate, 'M/d') : '日付なし'}">11/16</span>
            </div>

            <div class="row row-cols-4 g-2 mb-4">
                <div class="col">
                    <div class="nutrient">
                        <small>kcal</small>
                        <div class="value" th:text="${meal.calories}">0</div>
                    </div>
                </div>
                <div class="col">
                    <div class="nutrient">
                        <small>P</small>
                        <div class="value" th:text="${meal.protein}">0</div>
                    </div>
                </div>
                <div class="col">
                    <div class="nutrient">
                        <small>F</small>
                        <div class="value" th:text="${meal.fat}">0</div>
                    </div>
                </div>
                <div class="col">
                    <div class="nutrient">
                        <small>C</small>
                        <div class="value" th:text="${meal.carbs}">0</div>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2">
                <a th:href="@{/edit/{id}(id=${meal.id})}"
                   class="btn btn-warning flex-fill">編集する</a>
                <a th:href="@{/}" class="btn btn-secondary flex-fill">一覧へ戻る</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
