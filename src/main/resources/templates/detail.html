<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>食事詳細</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1 class="mb-4">食事詳細</h1>

    <p>
        <strong>ID：</strong>
        <span th:text="${meal.id}"></span>
    </p>

    <p>
        <strong>食事名：</strong>
        <span th:text="${meal.mealName}"></span>
    </p>

    <p>
        <strong>カロリー：</strong>
        <span th:text="${meal.calories}"></span>
    </p>

    <p>
        <strong>たんぱく質：</strong>
        <span th:text="${meal.protein}"></span>
    </p>

    <p>
        <strong>脂質：</strong>
        <span th:text="${meal.fat}"></span>
    </p>

    <p>
        <strong>炭水化物：</strong>
        <span th:text="${meal.carbs}"></span>
    </p>

    <a
            th:href="@{/edit/{id}(id=${meal.id})}"
            class="btn btn-warning me-2">
        編集する
    </a>

    <a th:href="@{/}" class="btn btn-secondary">
        一覧へ戻る
    </a>

</div>

</body>
</html>
