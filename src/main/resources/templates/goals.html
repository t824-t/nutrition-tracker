<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Nutrition Tracker
    </title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <script
            src="https://cdn.jsdelivr.net/npm/chart.js">
    </script>

<style>
/* nutrition-ui-v1 */
    body {
        background: #f5f7fb;
        color: #243047;
        font-family: sans-serif;
    }

    .container {
        max-width: 1100px;
        padding-bottom: 60px;
    }

    h1, h2, h3 {
        font-weight: 700;
        color: #243047;
    }

    .card {
        border: none;
        border-radius: 12px;
        box-shadow: 0 4px 20px #00000012;
    }

    .card-body {
        padding: 28px;
    }

    .form-control, .form-select {
        border: 1px solid #ccd3df;
        border-radius: 6px;
        padding: 10px 12px;
    }

    .btn {
        border-radius: 6px;
        padding: 10px 16px;
        font-weight: 500;
    }

    .btn-primary {
        background: #2563eb;
        border-color: #2563eb;
    }

    .btn-primary:hover {
        background: #1d4ed8;
        border-color: #1d4ed8;
    }

    .table {
        background: white;
    }

    .progress {
        height: 12px;
        border-radius: 10px;
    }

    .progress-bar {
        background: #2563eb;
    }

    @media (max-width: 768px) {
        .container {
            margin-top: 24px !important;
        }

        .card-body {
            padding: 20px;
        }

        .btn {
            padding: 9px 12px;
        }
    }

/* meal-table-mobile-fix */
.table-responsive .table {
    min-width: 760px;
}
.table-responsive .table th,
.table-responsive .table td {
    white-space: nowrap;
}

</style>

</head>

<body>
<div class="container mt-5">

<nav class="d-flex flex-wrap gap-2 mb-4 align-items-center">
    <a class="btn btn-outline-primary" th:href="@{/}">ダッシュボード</a>
    <a class="btn btn-outline-primary" th:href="@{/meals}">食事管理</a>
    <a class="btn btn-outline-primary" th:href="@{/weights}">体重管理</a>
    <a class="btn btn-outline-primary" th:href="@{/goals}">目標設定</a>

    <form th:action="@{/logout}" method="post"
          class="ms-md-auto mb-0">
        <button type="submit" class="btn btn-outline-danger">
            ログアウト
        </button>
    </form>
</nav>
<h1 class="mb-4">目標設定</h1>
    <!-- ========================= -->
    <!-- 栄養目標 -->
    <!-- ========================= -->

    <div class="card mb-4">

        <div class="card-body">

            <h3 class="card-title mb-3">
                栄養目標
            </h3>


            <form
                    th:action="@{/goal}"
                    method="post"
                    th:object="${nutritionGoal}">

                <div class="row">


                    <!-- カロリー -->
                    <div class="col-6 col-md-3 mb-3">

                        <label class="form-label">
                            目標カロリー
                        </label>

                        <input
                                type="number"
                                class="form-control"
                                th:field="*{targetCalories}">

                        <div
                                class="text-danger"
                                th:if="${#fields.hasErrors('targetCalories')}"
                                th:errors="*{targetCalories}">
                        </div>

                    </div>


                    <!-- P -->
                    <div class="col-6 col-md-3 mb-3">

                        <label class="form-label">
                            目標たんぱく質
                        </label>

                        <input
                                type="number"
                                step="0.1"
                                class="form-control"
                                th:field="*{targetProtein}">

                        <div
                                class="text-danger"
                                th:if="${#fields.hasErrors('targetProtein')}"
                                th:errors="*{targetProtein}">
                        </div>

                    </div>


                    <!-- F -->
                    <div class="col-6 col-md-3 mb-3">

                        <label class="form-label">
                            目標脂質
                        </label>

                        <input
                                type="number"
                                step="0.1"
                                class="form-control"
                                th:field="*{targetFat}">

                        <div
                                class="text-danger"
                                th:if="${#fields.hasErrors('targetFat')}"
                                th:errors="*{targetFat}">
                        </div>

                    </div>


                    <!-- C -->
                    <div class="col-6 col-md-3 mb-3">

                        <label class="form-label">
                            目標炭水化物
                        </label>

                        <input
                                type="number"
                                step="0.1"
                                class="form-control"
                                th:field="*{targetCarbs}">

                        <div
                                class="text-danger"
                                th:if="${#fields.hasErrors('targetCarbs')}"
                                th:errors="*{targetCarbs}">
                        </div>

                    </div>

                </div>


                <button
                        type="submit"
                        class="btn btn-success">
                    目標を保存
                </button>

            </form>

        </div>

    </div>



</div>
</body>
</html>
