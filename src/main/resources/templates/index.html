<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>
        Nutrition Tracker
    </title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <script
            src="https://cdn.jsdelivr.net/npm/chart.js">
    </script>
</head>


<body>

<div class="container mt-5">

    <h1 class="mb-4">
        栄養管理アプリ
    </h1>


    <!-- ========================= -->
    <!-- 食事登録 -->
    <!-- ========================= -->

    <form
            th:action="@{/meals}"
            method="post"
            th:object="${meal}">


        <!-- 日付 -->
        <div class="mb-3">

            <label class="form-label">
                日付
            </label>

            <input
                    type="date"
                    class="form-control"
                    th:field="*{mealDate}">

            <div
                    class="text-danger"
                    th:if="${#fields.hasErrors('mealDate')}"
                    th:errors="*{mealDate}">
            </div>

        </div>


        <!-- 食事名 -->
        <div class="mb-3">

            <label class="form-label">
                食事名
            </label>

            <input
                    type="text"
                    class="form-control"
                    th:field="*{mealName}">

            <div
                    class="text-danger"
                    th:if="${#fields.hasErrors('mealName')}"
                    th:errors="*{mealName}">
            </div>

        </div>


        <!-- カロリー -->
        <div class="mb-3">

            <label class="form-label">
                カロリー
            </label>

            <input
                    type="number"
                    class="form-control"
                    th:field="*{calories}">

            <div
                    class="text-danger"
                    th:if="${#fields.hasErrors('calories')}"
                    th:errors="*{calories}">
            </div>

        </div>


        <!-- たんぱく質 -->
        <div class="mb-3">

            <label class="form-label">
                たんぱく質
            </label>

            <input
                    type="number"
                    step="0.1"
                    class="form-control"
                    th:field="*{protein}">

            <div
                    class="text-danger"
                    th:if="${#fields.hasErrors('protein')}"
                    th:errors="*{protein}">
            </div>

        </div>


        <!-- 脂質 -->
        <div class="mb-3">

            <label class="form-label">
                脂質
            </label>

            <input
                    type="number"
                    step="0.1"
                    class="form-control"
                    th:field="*{fat}">

            <div
                    class="text-danger"
                    th:if="${#fields.hasErrors('fat')}"
                    th:errors="*{fat}">
            </div>

        </div>


        <!-- 炭水化物 -->
        <div class="mb-3">

            <label class="form-label">
                炭水化物
            </label>

            <input
                    type="number"
                    step="0.1"
                    class="form-control"
                    th:field="*{carbs}">

            <div
                    class="text-danger"
                    th:if="${#fields.hasErrors('carbs')}"
                    th:errors="*{carbs}">
            </div>

        </div>


        <button
                type="submit"
                class="btn btn-primary">
            登録
        </button>

    </form>


    <hr>


    <!-- ========================= -->
    <!-- 日付選択 -->
    <!-- ========================= -->

    <form
            th:action="@{/}"
            method="get"
            class="mb-2">

        <label class="form-label">
            日付
        </label>

        <div class="input-group">

            <input
                    type="date"
                    name="date"
                    class="form-control"
                    th:value="${#temporals.format(selectedDate, 'yyyy-MM-dd')}">

            <input
                    type="hidden"
                    name="keyword"
                    th:value="${keyword}">

            <input
                    type="hidden"
                    name="sort"
                    th:value="${sort}">

            <button
                    type="submit"
                    class="btn btn-primary">
                この日を表示
            </button>

        </div>

    </form>


    <!-- ========================= -->
    <!-- 日付移動 -->
    <!-- ========================= -->

    <div class="d-flex gap-2 mb-4">

        <a
                th:href="@{/(date=${selectedDate.minusDays(1)}, sort=${sort})}"
                class="btn btn-outline-secondary">
            ← 前の日
        </a>

        <a
                th:href="@{/}"
                class="btn btn-outline-primary">
            今日
        </a>

        <a
                th:href="@{/(date=${selectedDate.plusDays(1)}, sort=${sort})}"
                class="btn btn-outline-secondary">
            次の日 →
        </a>

    </div>


    <!-- ========================= -->
    <!-- 検索 -->
    <!-- ========================= -->

    <h3 class="mb-3">
        検索
    </h3>

    <form
            th:action="@{/}"
            method="get">

        <input
                type="hidden"
                name="date"
                th:value="${selectedDate}">

        <input
                type="hidden"
                name="sort"
                th:value="${sort}">


        <div class="input-group mb-3">

            <input
                    type="text"
                    name="keyword"
                    class="form-control"
                    th:value="${keyword}"
                    placeholder="食事名で検索">

            <button
                    class="btn btn-outline-secondary"
                    type="submit">
                検索
            </button>

            <a
                    th:href="@{/(date=${selectedDate}, sort=${sort})}"
                    class="btn btn-secondary">
                クリア
            </a>

        </div>

    </form>


    <!-- ========================= -->
    <!-- 並び替え -->
    <!-- ========================= -->

    <form
            th:action="@{/}"
            method="get"
            class="mb-3">

        <input
                type="hidden"
                name="keyword"
                th:value="${keyword}">

        <input
                type="hidden"
                name="date"
                th:value="${selectedDate}">

        <select
                name="sort"
                class="form-select"
                onchange="this.form.submit()">

            <option
                    value="new"
                    th:selected="${sort == 'new'}">
                新しい順
            </option>

            <option
                    value="old"
                    th:selected="${sort == 'old'}">
                古い順
            </option>

        </select>

    </form>


    <!-- ========================= -->
    <!-- 栄養目標 -->
    <!-- ========================= -->

    <div class="card mb-4">

        <div class="card-body">

            <h3 class="card-title mb-3">
                栄養目標
            </h3>


            <form
                    th:action="@{/goal}"
                    method="post"
                    th:object="${nutritionGoal}">

                <div class="row">


                    <!-- カロリー -->
                    <div class="col-md-3 mb-3">

                        <label class="form-label">
                            目標カロリー
                        </label>

                        <input
                                type="number"
                                class="form-control"
                                th:field="*{targetCalories}">

                        <div
                                class="text-danger"
                                th:if="${#fields.hasErrors('targetCalories')}"
                                th:errors="*{targetCalories}">
                        </div>

                    </div>


                    <!-- P -->
                    <div class="col-md-3 mb-3">

                        <label class="form-label">
                            目標たんぱく質
                        </label>

                        <input
                                type="number"
                                step="0.1"
                                class="form-control"
                                th:field="*{targetProtein}">

                        <div
                                class="text-danger"
                                th:if="${#fields.hasErrors('targetProtein')}"
                                th:errors="*{targetProtein}">
                        </div>

                    </div>


                    <!-- F -->
                    <div class="col-md-3 mb-3">

                        <label class="form-label">
                            目標脂質
                        </label>

                        <input
                                type="number"
                                step="0.1"
                                class="form-control"
                                th:field="*{targetFat}">

                        <div
                                class="text-danger"
                                th:if="${#fields.hasErrors('targetFat')}"
                                th:errors="*{targetFat}">
                        </div>

                    </div>


                    <!-- C -->
                    <div class="col-md-3 mb-3">

                        <label class="form-label">
                            目標炭水化物
                        </label>

                        <input
                                type="number"
                                step="0.1"
                                class="form-control"
                                th:field="*{targetCarbs}">

                        <div
                                class="text-danger"
                                th:if="${#fields.hasErrors('targetCarbs')}"
                                th:errors="*{targetCarbs}">
                        </div>

                    </div>

                </div>


                <button
                        type="submit"
                        class="btn btn-success">
                    目標を保存
                </button>

            </form>

        </div>

    </div>


    <!-- ========================= -->
    <!-- 体重記録 -->
    <!-- ========================= -->

    <div class="card mb-4">

        <div class="card-body">

            <h3 class="card-title mb-3">
                体重記録
            </h3>


            <form
                    th:action="@{/weight}"
                    method="post"
                    th:object="${weightRecord}">

                <div class="row align-items-end">


                    <!-- 日付 -->
                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            日付
                        </label>

                        <input
                                type="date"
                                class="form-control"
                                th:field="*{recordDate}">

                        <div
                                class="text-danger"
                                th:if="${#fields.hasErrors('recordDate')}"
                                th:errors="*{recordDate}">
                        </div>

                    </div>


                    <!-- 体重 -->
                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            体重
                        </label>

                        <input
                                type="number"
                                step="0.1"
                                class="form-control"
                                th:field="*{weight}"
                                placeholder="例：70.2">

                        <div
                                class="text-danger"
                                th:if="${#fields.hasErrors('weight')}"
                                th:errors="*{weight}">
                        </div>

                    </div>


                    <div class="col-md-2 mb-3">

                        <button
                                type="submit"
                                class="btn btn-primary">
                            体重を記録
                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>


    <!-- ========================= -->
    <!-- 体重履歴 -->
    <!-- ========================= -->

    <div class="card mb-4">

        <div class="card-body">

            <h3 class="card-title mb-3">
                体重履歴
            </h3>

            <table class="table">

                <thead>
                <tr>
                    <th>日付</th>
                    <th>体重</th>
                    <th>操作</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="record : ${weightRecords}">

                    <td th:text="${record.recordDate}">
                    </td>

                    <td>
                        <span th:text="${record.weight}">
                        </span>
                        kg
                    </td>

                    <td>

                        <form
                                th:action="@{/weight/delete/{id}(id=${record.id})}"
                                method="post">

                            <button
                                    type="submit"
                                    class="btn btn-danger btn-sm">
                                削除
                            </button>

                        </form>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>


    <!-- ========================= -->
    <!-- 体重グラフ -->
    <!-- ========================= -->

    <div class="card mb-4">

        <div class="card-body">

            <h3 class="card-title mb-3">
                体重推移
            </h3>

            <canvas id="weightChart">
            </canvas>

        </div>

    </div>


    <!-- ========================= -->
    <!-- 選択日の進捗 -->
    <!-- ========================= -->

    <div class="card mb-4">

        <div class="card-body">

            <h3 class="card-title mb-3">
                選択日の進捗
            </h3>

            <p>
                日付：
                <strong th:text="${selectedDate}">
                </strong>
            </p>


            <!-- カロリー -->
            <div class="mb-4">

                <div class="d-flex justify-content-between">

                    <span>
                        カロリー
                    </span>

                    <strong>

                        <span th:text="${totalCalories}">
                        </span>

                        /

                        <span th:text="${nutritionGoal.targetCalories}">
                        </span>

                        kcal

                    </strong>

                </div>


                <div class="progress">

                    <div
                            class="progress-bar"
                            role="progressbar"
                            th:style="'width:' + ${calorieProgress} + '%'"
                            th:text="${calorieProgress} + '%'">
                    </div>

                </div>

            </div>


            <!-- たんぱく質 -->
            <div class="mb-4">

                <div class="d-flex justify-content-between">

                    <span>
                        たんぱく質
                    </span>

                    <strong>

                        <span th:text="${totalProtein}">
                        </span>

                        /

                        <span th:text="${nutritionGoal.targetProtein}">
                        </span>

                        g

                    </strong>

                </div>


                <div class="progress">

                    <div
                            class="progress-bar"
                            role="progressbar"
                            th:style="'width:' + ${proteinProgress} + '%'"
                            th:text="${proteinProgress} + '%'">
                    </div>

                </div>

            </div>


            <!-- 脂質 -->
            <div class="mb-4">

                <div class="d-flex justify-content-between">

                    <span>
                        脂質
                    </span>

                    <strong>

                        <span th:text="${totalFat}">
                        </span>

                        /

                        <span th:text="${nutritionGoal.targetFat}">
                        </span>

                        g

                    </strong>

                </div>


                <div class="progress">

                    <div
                            class="progress-bar"
                            role="progressbar"
                            th:style="'width:' + ${fatProgress} + '%'"
                            th:text="${fatProgress} + '%'">
                    </div>

                </div>

            </div>


            <!-- 炭水化物 -->
            <div class="mb-2">

                <div class="d-flex justify-content-between">

                    <span>
                        炭水化物
                    </span>

                    <strong>

                        <span th:text="${totalCarbs}">
                        </span>

                        /

                        <span th:text="${nutritionGoal.targetCarbs}">
                        </span>

                        g

                    </strong>

                </div>


                <div class="progress">

                    <div
                            class="progress-bar"
                            role="progressbar"
                            th:style="'width:' + ${carbsProgress} + '%'"
                            th:text="${carbsProgress} + '%'">
                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- 食事一覧 -->
    <!-- ========================= -->

    <h2 class="mb-3">
        登録済みの食事
    </h2>


    <table class="table">

        <thead>

        <tr>
            <th>ID</th>
            <th>食事名</th>
            <th>日付</th>
            <th>カロリー</th>
            <th>たんぱく質</th>
            <th>脂質</th>
            <th>炭水化物</th>
            <th>操作</th>
        </tr>

        </thead>


        <tbody>

        <tr th:each="meal : ${meals}">

            <td th:text="${meal.id}">
            </td>

            <td th:text="${meal.mealName}">
            </td>

            <td th:text="${meal.mealDate}">
            </td>

            <td th:text="${meal.calories}">
            </td>

            <td th:text="${meal.protein}">
            </td>

            <td th:text="${meal.fat}">
            </td>

            <td th:text="${meal.carbs}">
            </td>


            <td>

                <a
                        class="btn btn-info btn-sm me-2"
                        th:href="@{/detail/{id}(id=${meal.id})}">
                    詳細
                </a>


                <a
                        class="btn btn-warning btn-sm me-2"
                        th:href="@{/edit/{id}(id=${meal.id})}">
                    編集
                </a>


                <form
                        th:action="@{/delete/{id}(id=${meal.id})}"
                        method="post"
                        class="d-inline">

                    <button
                            class="btn btn-danger btn-sm"
                            type="submit">
                        削除
                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>


    <!-- ========================= -->
    <!-- ページング -->
    <!-- ========================= -->

    <div
            class="mt-3"
            th:if="${totalPages > 0}">

        <a
                th:if="${currentPage > 0}"
                th:href="@{/(
                    page=${currentPage - 1},
                    keyword=${keyword},
                    sort=${sort},
                    date=${selectedDate}
                )}"
                class="btn btn-secondary">
            ← 前へ
        </a>


        <span th:text="${currentPage + 1}">
        </span>

        /

        <span th:text="${totalPages}">
        </span>


        <a
                th:if="${currentPage + 1 < totalPages}"
                th:href="@{/(
                    page=${currentPage + 1},
                    keyword=${keyword},
                    sort=${sort},
                    date=${selectedDate}
                )}"
                class="btn btn-secondary">
            次へ →
        </a>

    </div>

</div>


<!-- ========================= -->
<!-- 体重グラフ -->
<!-- ========================= -->

<script th:inline="javascript">

    const weightRecords =
        /*[[${weightRecords}]]*/ [];

    const labels =
        weightRecords.map(
            record => record.recordDate
        );

    const weights =
        weightRecords.map(
            record => record.weight
        );

    const ctx =
        document.getElementById(
            'weightChart'
        );


    if (ctx) {

        new Chart(
            ctx,
            {

                type: 'line',

                data: {

                    labels: labels,

                    datasets: [
                        {
                            label: '体重',

                            data: weights,

                            tension: 0.2
                        }
                    ]
                },


                options: {

                    responsive: true,

                    scales: {

                        y: {

                            beginAtZero: false
                        }
                    }
                }
            }
        );
    }

</script>


</body>
</html>
