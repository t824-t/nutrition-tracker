<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録 | Nutrition Tracker</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f5f7fb;
            color: #243047;
            margin: 0;
            padding: 60px 20px;
        }
        .register-card {
            max-width: 400px;
            margin: auto;
            padding: 32px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px #00000012;
        }
        h1 { text-align: center; }
        label { display: block; margin: 16px 0 6px; }
        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccd3df;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 24px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        .center { text-align: center; }
        .error { color: #c62828; }
        .hint { color: #64748b; font-size: 13px; }
        a { color: #2563eb; }

        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            padding-right: 72px;
        }
        .password-toggle {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: auto;
            margin: 0;
            padding: 8px 10px;
            background: transparent;
            color: #2563eb;
            font-size: 13px;
        }
        .password-toggle:hover {
            background: #eff6ff;
        }
    </style>
</head>
<body>
<div class="register-card">
    <h1>Nutrition Tracker</h1>
    <p class="center">栄養管理アプリへようこそ</p>

    <h2>新規ユーザー登録</h2>
    <p>ユーザー名とパスワードを設定してください。</p>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/register}" method="post">
        <label for="username">ユーザー名</label>
        <input id="username" name="username"
               type="text" autocomplete="username"
               minlength="3" maxlength="50" required>
        <p class="hint">3〜50文字で入力してください</p>

        <label for="password">パスワード</label>
        <div class="password-wrapper">
        <input id="password" name="password"
               type="password" autocomplete="new-password"
               minlength="8" required>
        <button type="button" id="togglePassword"
                class="password-toggle"
                aria-label="パスワードを表示"
                aria-pressed="false">表示</button>
        </div>
        <p class="hint">8文字以上で入力してください</p>

        <button type="submit">アカウントを作成する</button>
    </form>

    <p class="center">すでにアカウントをお持ちの方</p>
    <p class="center">
        <a th:href="@{/login}">ログイン画面に戻る</a>
    </p>
</div>

<script>
document.getElementById("togglePassword").addEventListener("click", function () {
    const input = document.getElementById("password");
    const visible = input.type === "password";
    input.type = visible ? "text" : "password";
    this.textContent = visible ? "隠す" : "表示";
    this.setAttribute("aria-label", visible ? "パスワードを隠す" : "パスワードを表示");
    this.setAttribute("aria-pressed", String(visible));
});
</script>
</body>
</html>
